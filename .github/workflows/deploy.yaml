name: Deploy Property Scraper Image Classification and Matching APIs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: Build & Deploy to GKE
    runs-on: ubuntu-latest
    if: ${{ secrets.GOOGLE_PROJECT != '' && secrets.GOOGLE_APPLICATION_CREDENTIALS != '' }}
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Install the gcloud cli
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          install_components: 'gke-gcloud-auth-plugin'
          export_default_credentials: true

      - name: Build and push the Docker image
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker build -t us-central1-docker.pkg.dev/$GOOGLE_PROJECT/property-scraper/image-cls-mat:latest .
          docker push us-central1-docker.pkg.dev/$GOOGLE_PROJECT/property-scraper/image-cls-mat:latest

      - name: Deploy to GKE
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          gcloud container clusters get-credentials cluster-1 --region us-central1-c
          sed -i "s/GOOGLE_PROJECT/$GOOGLE_PROJECT/g" resources.yaml
          kubectl apply -f resources.yaml
