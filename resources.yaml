---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: image-cls-mat
spec:
  domains:
  - scraper.yourdomain.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: image-cls-mat
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-cls-mat
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: image-cls-mat
    networking.gke.io/v1beta1.FrontendConfig: image-cls-mat
    networking.gke.io/managed-certificates: image-cls-mat
spec:
  defaultBackend:
    service:
      name: image-cls-mat
      port:
        number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: image-cls-mat
spec:
  type: NodePort
  selector:
    app: image-cls-mat
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-cls-mat
  labels:
    app: image-cls-mat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-cls-mat
  template:
    metadata:
      labels:
        app: image-cls-mat
    spec:
      containers:
      - name: image-cls-mat
        image: property-scraper/image-cls-mat:latest
        envFrom:
        - secretRef:
            name: property-scraper-secrets
            optional: true
        - configMapRef:
            name: property-scraper-config
            optional: true

